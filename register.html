<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Digital Diary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #000000;
            color: #ffffff;
        }
        .container {
            max-width: 390px;
            width: 100%;
            background: #141414;
            border: 1px solid #2b2b2b;
            padding: 28px 26px 32px;
            border-radius: 8px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
        }
        .form-signin-heading {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
        }
        .form-control {
            height: 44px;
            font-size: 15px;
            margin-bottom: 12px;
            background: #1f1f1f;
            color: #ffffff;
            border: 1px solid #383838;
        }
        .form-control::placeholder {
            color: #9ca3af;
        }
        .form-control:focus {
            background: #242424;
            color: #ffffff;
            border-color: #337ab7;
            box-shadow: none;
        }
        .error-msg {
            color: #fca5a5;
            background: rgba(185, 28, 28, 0.25);
            border: 1px solid #dc2626;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 14px;
            font-size: 13px;
        }
        .switch-link {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: #9ca3af;
        }
        .switch-link a {
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <form class="form-signin" method="POST">
            <h1 class="form-signin-heading">Create Account</h1>

            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}

            <input type="text" class="form-control" name="username" placeholder="Choose a Username" required="" autofocus="">
            <input type="password" class="form-control" name="password" placeholder="Choose a Password" required="">
            <button class="btn btn-lg btn-primary btn-block" type="submit">Register</button>

            <div class="switch-link">
                Already have an account? <a href="/login">Login</a>
            </div>
        </form>
    </div>
</body>
</html>
